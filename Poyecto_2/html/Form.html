<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Completo con Bootstrap</title>
  
  <!-- Enlace CSS de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-light">

  <div class="container py-5">

    <!-- Título y Párrafo Centrados -->
    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold text-dark">Formulario Completo de Reseña y Registro</h1>
      <p class="lead text-muted mx-auto" style="max-width: 600px;">
        Llena todos los campos a continuación para dejarnos tu opinión detallada sobre la página que creaste.
      </p>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm border-0 p-4">
          <div class="card-body">
            
            <form>
              
              <!-- 1. Campo de Texto (Nombre) -->
              <div class="mb-3">
                <label for="nombre" class="form-label fw-bold">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ej. Ana Gómez">
              </div>

              <!-- 2. Campo de Correo Electrónico con texto de ayuda -->
              <div class="mb-3">
                <label for="email" class="form-label fw-bold">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com">
                <div class="form-text">Nunca compartiremos tu información con terceros.</div>
              </div>

              <!-- 3. Campo de Contraseña -->
              <div class="mb-3">
                <label for="password" class="form-label fw-bold">Contraseña temporal</label>
                <input type="password" class="form-control" id="password" placeholder="Crea una contraseña">
              </div>

              <!-- 4. Selector Desplegable (Select) -->
              <div class="mb-3">
                <label for="valoracion" class="form-label fw-bold">Calificación general de la página</label>
                <select class="form-control" id="valoracion">
                  <option selected>Elige una opción...</option>
                  <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
                  <option value="4">⭐⭐⭐⭐ Muy buena</option>
                  <option value="3">⭐⭐⭐ Regular</option>
                  <option value="2">⭐⭐ Mala</option>
                  <option value="1">⭐ Pésima</option>
                </select>
              </div>

              <!-- 5. Área de Texto (Reseña detallada) -->
              <div class="mb-3">
                <label for="reseña" class="form-label fw-bold">Escribe tu reseña detallada</label>
                <textarea class="form-control" id="reseña" rows="4" placeholder="Cuéntanos qué te pareció el diseño, las cajitas, etc."></textarea>
              </div>

              <!-- 6. Fechas y Horas -->
              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="fecha" class="form-label fw-bold">Fecha de visita</label>
                  <input type="date" class="form-control" id="fecha">
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                  <label for="hora" class="form-label fw-bold">Hora aproximada</label>
                  <input type="time" class="form-control" id="hora">
                </div>
              </div>

              <!-- 7. Selector de Color favorito para la web -->
              <div class="mb-3">
                <label for="colorWeb" class="form-label fw-bold">Color favorito de tu interfaz</label>
                <input type="color" class="form-control form-control-color" id="colorWeb" value="#631aff" title="Elige un color">
              </div>

              <!-- 8. Subida de Archivos (Captura de pantalla de su página) -->
              <div class="mb-3">
                <label for="archivo" class="form-label fw-bold">Sube una captura de tu página (opcional)</label>
                <input class="form-control" type="file" id="archivo">
              </div>

              <!-- 9. Botones de Radio (Opciones únicas) -->
              <div class="mb-3">
                <label class="form-label fw-bold d-block">¿Recomendarías este sitio?</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="recomendar" id="radio1" value="si" checked>
                  <label class="form-check-label" for="radio1">Sí, totalmente</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="recomendar" id="radio2" value="no">
                  <label class="form-check-label" for="radio2">Lo dudo</label>
                </div>
              </div>

              <!-- 10. Casilla de Verificación (Checkbox) -->
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="terminos">
                <label class="form-check-label" for="terminos">Autorizo que mi reseña sea publicada en la sección principal.</label>
              </div>

              <!-- Botón de Envío -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Enviar Reseña Completa</button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Enlace JavaScript de Bootstrap -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
