<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Mi primera practica</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
    <div>
        <h1>
            Mi primera practica de java script
        </h1> 
        <button id="btn_cambio">Dale click</button>
   
    </div>
    
    <div class="padre" id="div_padre">

        <div class="hijo azul"></div>

    <div>

    <script src="funtion.js"></script>

    <form >
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"  placeholder="Ingresa tu nombre">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"  placeholder="Ingresa tu email">

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" cols="50" placeholder="Ingresa tu mensaje"></textarea>
        <br>
        <input type="submit" value="Enviar">
    </form>
